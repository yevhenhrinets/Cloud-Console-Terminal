<script>
    let currentTerminalUser = null;

    function notifyAdminAboutSupportReports(reports) {
        if (!reports || reports.length === 0) return;
        reports.forEach(r => {
            const preview = String(r.message || '').replace(/[\r\n]+/g, ' ').slice(0, 80);
            printOutput(
                `🔔 Новое обращение в поддержку [#${r.inner_id || '?'}] от ${r.user_email || 'unknown'}: "${preview}"\n👉 Введите 'reports' или 'show issues' для просмотра и ответа на email.`,
                'output-info',
                false
            );
        });
    }

    async function checkAdminSupportAlerts(user) {
        if (!user || !window.SupportReportsSync) return;
        if (typeof window.isAdminUser === 'function' && !window.isAdminUser(user)) return;
        try {
            await window.SupportReportsSync.checkAndNotifyAdmin(user, (unseen) => {
                notifyAdminAboutSupportReports(unseen);
            });
            window.SupportReportsSync.subscribeRealtimeAdminNotifications(user, (newRep) => {
                notifyAdminAboutSupportReports([newRep]);
            });
        } catch (e) {}
    }

    let lastPageHintPrintedPath = null;
    async function showLastPageContinueHint() {
        if (!window.LastPageSync || typeof window.LastPageSync.getBestLastPage !== 'function') return;
        try {
            const best = await window.LastPageSync.getBestLastPage();
            if (best && best.path && best.path !== lastPageHintPrintedPath) {
                lastPageHintPrintedPath = best.path;
                printOutput(
                    `▶️ Вы остановились на странице: ${best.title || best.path} (${best.path}) — введите \`Continue\` или нажмите ▶️ Continue.`,
                    'output-info',
                    false
                );
            }
        } catch (e) {}
    }

    async function initTerminal() {
        const prompt = document.getElementById('prompt');
        
        printOutput('Инициализация облачного терминала...', 'output-info');

        try {
            currentTerminalUser = await fetchCurrentUser();

            if (currentTerminalUser && !currentTerminalUser.isGuest) {
                restoreConsoleHistory();
                prompt.textContent = `${currentTerminalUser.email}:~$`;
                if (window.supabaseClient && (typeof navigator === 'undefined' || navigator.onLine !== false)) {
                    updateLoginTimestamp(currentTerminalUser.id).catch(() => {});
                    if (typeof window.flushAllOfflineConsoleQueues === 'function') {
                        window.flushAllOfflineConsoleQueues().then(() => {
                            if (window.CustomAliasesSync) window.CustomAliasesSync.syncAndApply(currentTerminalUser).catch(() => {});
                            if (window.TaskCooldowns) window.TaskCooldowns.syncFromSupabase(currentTerminalUser.id).catch(() => {});
                            showLastPageContinueHint().catch(() => {});
                            return checkAdminSupportAlerts(currentTerminalUser);
                        }).catch(() => {});
                    } else {
                        if (window.CustomAliasesSync) window.CustomAliasesSync.syncAndApply(currentTerminalUser).catch(() => {});
                        if (window.TaskCooldowns) window.TaskCooldowns.syncFromSupabase(currentTerminalUser.id).catch(() => {});
                        showLastPageContinueHint().catch(() => {});
                        checkAdminSupportAlerts(currentTerminalUser);
                    }
                } else {
                    printOutput('📡 Офлайн-режим: консоль работает локально. Изменения синхронизируются при подключении.', 'output-info', false);
                    showLastPageContinueHint().catch(() => {});
                }
            } else {
                prompt.textContent = `user@cloud:~$`;
                printOutput('👋 Хмарний термінал готовий до роботи (Демо-режим). Всі команди активні!', 'output-info');
                printOutput('💡 Введіть: commands list, support, notes, home 1, home 2, home 3', 'output-success');
                restoreConsoleHistory();
                showLastPageContinueHint().catch(() => {});
            }

            if (window.supabaseClient && window.supabaseClient.auth) {
                window.supabaseClient.auth.onAuthStateChange(async (event, session) => {
                    if (event === 'SIGNED_IN') {
                        const freshUser = await fetchCurrentUser();
                        if (freshUser) {
                            currentTerminalUser = freshUser;
                            restoreConsoleHistory();
                            prompt.textContent = `${freshUser.email}:~$`;
                            if (typeof window.flushAllOfflineConsoleQueues === 'function') {
                                window.flushAllOfflineConsoleQueues().then(() => {
                                    if (window.CustomAliasesSync) window.CustomAliasesSync.syncAndApply(freshUser).catch(() => {});
                                    if (window.TaskCooldowns) window.TaskCooldowns.syncFromSupabase(freshUser.id).catch(() => {});
                                    showLastPageContinueHint().catch(() => {});
                                    return checkAdminSupportAlerts(freshUser);
                                }).catch(() => {});
                            } else {
                                if (window.CustomAliasesSync) window.CustomAliasesSync.syncAndApply(freshUser).catch(() => {});
                                if (window.TaskCooldowns) window.TaskCooldowns.syncFromSupabase(freshUser.id).catch(() => {});
                                showLastPageContinueHint().catch(() => {});
                                checkAdminSupportAlerts(freshUser);
                            }
                        }
                    } else if (event === 'SIGNED_OUT') {
                        currentTerminalUser = null;
                        if (typeof currentUserCache !== 'undefined') currentUserCache = null;
                        if (typeof clearCachedAuthUser === 'function') clearCachedAuthUser();
                        if (terminalOutput) terminalOutput.innerHTML = '';
                        localStorage.removeItem(STORAGE_HISTORY_KEY);
                        prompt.textContent = `user@cloud:~$`;
                        printOutput('👋 Вы вышли из аккаунта. Введите "login" или "switch account" для входа.', 'output-info', true);
                    }
                });
            }
        } catch (err) {
            prompt.textContent = currentTerminalUser && !currentTerminalUser.isGuest ? `${currentTerminalUser.email}:~$` : `user@cloud:~$`;
            restoreConsoleHistory();
            printOutput('📡 Локальный режим активен (' + err.message + ')', 'output-info', false);
        }
    }
    
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initTerminal);
    } else {
        initTerminal();
    }
    
// Движок тиканья таймеров с поддержкой ends_at (не сбивается при закрытии вкладки)
function initTimerEngine() {
    let lastSecond = -1;

    setInterval(async () => {
        const now = new Date();
        const currentSecond = now.getSeconds();

        if (currentSecond !== lastSecond) {
            lastSecond = currentSecond;
            await tickTimers();
        }
    }, 200);
}

async function tickTimers() {
    if (!window.supabaseClient || (typeof navigator !== 'undefined' && navigator.onLine === false)) return;
    try {
        const { data: { session } } = await window.supabaseClient.auth.getSession();
        if (!session) return;
        const userId = session.user.id;

        const { data: runningTimers, error } = await window.supabaseClient
            .from('active_timers')
            .select('*')
            .eq('created_by', userId)
            .eq('status', 'running');

        if (error || !runningTimers || runningTimers.length === 0) return;

        const now = Date.now();

        for (const timer of runningTimers) {
            const span = document.getElementById(`timer-val-${timer.id}`);
            
            // Вычисляем оставшееся время по ends_at
            let remaining = timer.remaining_seconds;
            if (timer.ends_at) {
                const diffMs = new Date(timer.ends_at).getTime() - now;
                remaining = Math.max(0, Math.floor(diffMs / 1000));
            }

            if (remaining > 0) {
                // Обновляем отображение в DOM, если элемент виден на экране
                if (span) {
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;
                    span.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                }
            } else {
                // Время вышло! Удаляем активный таймер
                await window.supabaseClient.from('active_timers').delete().eq('id', timer.id);

                if (window.TaskCooldowns && typeof window.TaskCooldowns.recordCompletion === 'function') {
                    window.TaskCooldowns.recordCompletion(timer.name, timer.ends_at || now, userId);
                }

                // Записываем на склад completed_items
                const { data: existingItem } = await window.supabaseClient
                    .from('completed_items').select('*').eq('created_by', userId).eq('name', timer.name).single();

                if (existingItem) {
                    await window.supabaseClient.from('completed_items')
                        .update({ count: existingItem.count + 1, updated_at: new Date().toISOString() }).eq('id', existingItem.id);
                } else {
                    await window.supabaseClient.from('completed_items')
                        .insert([{ name: timer.name, count: 1, created_by: userId }]);
                }

                // Автоматически запускаем следующий из очереди в этой же группе (queue_group_id)
                const { data: queuedItems } = await window.supabaseClient
                    .from('active_timers').select('*').eq('created_by', userId).eq('queue_group_id', timer.queue_group_id)
                    .eq('status', 'queued').order('id', { ascending: true }).limit(1);

                if (queuedItems && queuedItems.length > 0) {
                    const nextTimer = queuedItems[0];
                    const newEndsAt = new Date(Date.now() + nextTimer.total_seconds * 1000).toISOString();
                    
                    await window.supabaseClient.from('active_timers')
                        .update({ 
                            status: 'running',
                            ends_at: newEndsAt 
                        }).eq('id', nextTimer.id);
                }

                if (span) span.textContent = "0:00 (Готово!)";
            }
        }
    } catch (err) {
        console.error('Ошибка движка таймеров:', err);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    initTimerEngine();
});
</script>
<script>
    const terminal = document.getElementById('terminal');
    const terminalOutput = document.getElementById('terminal-output');
    const input = document.getElementById('command-input');

    const STORAGE_HISTORY_KEY = 'terminal_console_history';
    const STORAGE_DRAFT_KEY = 'terminal_input_draft';
    const STORAGE_ACTIVE_CMD_KEY = 'terminal_active_cmd_prefix';
    const DEFAULT_INPUT_PLACEHOLDER = 'Команда (commands list, support, go to missions, home 1, home 2, home 3, history, write note)...';

    let pendingSteps = [];

    function renderActiveCmdChips() {
        const bar = document.getElementById('active-cmd-bar');
        const chipsContainer = document.getElementById('active-cmd-chips');
        if (!bar || !chipsContainer) return;

        if (!pendingSteps || pendingSteps.length === 0) {
            chipsContainer.innerHTML = '';
            bar.style.display = 'none';
            return;
        }

        chipsContainer.innerHTML = '';
        pendingSteps.forEach((step, idx) => {
            const chip = document.createElement('span');
            chip.className = 'active-cmd-chip';

            const label = document.createElement('span');
            label.className = 'active-cmd-chip-text';
            label.textContent = step;

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'active-cmd-chip-remove';
            removeBtn.textContent = '✕';
            removeBtn.title = idx === 0 ? 'Сбросить команду' : `Убрать шаг "${step}"`;
            removeBtn.addEventListener('click', () => removePendingStep(idx));

            chip.appendChild(label);
            chip.appendChild(removeBtn);
            chipsContainer.appendChild(chip);
        });

        bar.style.display = 'flex';
    }

    function setPendingSteps(steps, textValue = null, customPlaceholder = null) {
        pendingSteps = Array.isArray(steps)
            ? steps.map(s => String(s || '').trim()).filter(Boolean)
            : (steps ? [String(steps).trim()].filter(Boolean) : []);

        if (pendingSteps.length > 0) {
            localStorage.setItem(STORAGE_ACTIVE_CMD_KEY, JSON.stringify(pendingSteps));
            renderActiveCmdChips();
            input.placeholder = customPlaceholder || `Введите текст для "${pendingSteps[pendingSteps.length - 1]}"...`;
        } else {
            localStorage.removeItem(STORAGE_ACTIVE_CMD_KEY);
            renderActiveCmdChips();
            input.placeholder = DEFAULT_INPUT_PLACEHOLDER;
        }

        if (textValue !== null && textValue !== undefined) {
            input.value = String(textValue);
            localStorage.setItem(STORAGE_DRAFT_KEY, input.value);
        }
        if (typeof autoResizeTextarea === 'function') autoResizeTextarea();
        if (typeof syncViewportHeight === 'function') syncViewportHeight();
    }

    function setPendingCommand(prefix, textValue = null, customPlaceholder = null) {
        const clean = String(prefix || '').trim();
        setPendingSteps(clean ? [clean] : [], textValue, customPlaceholder);
    }

    function removePendingStep(index) {
        if (index <= 0 || pendingSteps.length <= 1) {
            clearPendingCommand(true);
            return;
        }
        const remaining = pendingSteps.slice(0, index);
        const firstLower = String(remaining[0] || '').toLowerCase();
        const isAliasFlow = firstLower.includes('alias') || firstLower.includes('алиас') || firstLower.includes('псевдоним');
        const nextPlaceholder = isAliasFlow
            ? 'Шаг 2/3: введите существующую команду...'
            : `Введите текст для "${remaining[remaining.length - 1]}"...`;
        setPendingSteps(remaining, '', nextPlaceholder);
        input.focus();
    }

    function clearPendingCommand(clearText = true) {
        pendingSteps = [];
        localStorage.removeItem(STORAGE_ACTIVE_CMD_KEY);
        renderActiveCmdChips();
        input.placeholder = DEFAULT_INPUT_PLACEHOLDER;
        if (clearText) {
            input.value = '';
            localStorage.removeItem(STORAGE_DRAFT_KEY);
        }
        if (typeof autoResizeTextarea === 'function') autoResizeTextarea();
        input.focus();
        if (typeof syncViewportHeight === 'function') syncViewportHeight();
    }

    const savedDraft = localStorage.getItem(STORAGE_DRAFT_KEY);
    if (savedDraft) {
        input.value = savedDraft;
    }
    const savedActiveCmd = localStorage.getItem(STORAGE_ACTIVE_CMD_KEY);
    if (savedActiveCmd) {
        try {
            const parsedSteps = JSON.parse(savedActiveCmd);
            if (Array.isArray(parsedSteps) && parsedSteps.length > 0) {
                setPendingSteps(parsedSteps, null, null);
            } else if (typeof savedActiveCmd === 'string') {
                setPendingCommand(savedActiveCmd, null, null);
            }
        } catch (e) {
            setPendingCommand(savedActiveCmd, null, null);
        }
    }

    // Универсальная функция вывода с поддержкой HTML (isHtml) для таймеров
    function printOutput(inputData, customClassName = '', save = true) {
        if (!inputData) return;

        let text = '';
        let className = customClassName;
        let isHtml = false;

        if (typeof inputData === 'object' && inputData !== null) {
            text = inputData.response || '';
            className = `terminal-line ${inputData.style || ''}`;
            isHtml = !!inputData.isHtml;
        } else {
            text = String(inputData);
            className = customClassName;
        }

        if (!text) return;

        const div = document.createElement('div');
        div.className = className;

        if (isHtml) {
            let formattedText = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            div.innerHTML = formattedText;
        } else {
            div.textContent = text;
        }

        if (terminalOutput) {
            terminalOutput.appendChild(div);
            
            // Двойной requestAnimationFrame гарантирует выполнение ровно в момент окончания отрисовки
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    terminalOutput.scrollTop = terminalOutput.scrollHeight;
                });
            });
        }

        if (save) {
            try {
                let history = JSON.parse(localStorage.getItem(STORAGE_HISTORY_KEY) || '[]');
                history.push({ text, className, isHtml });
                if (history.length > 100) history.shift();
                localStorage.setItem(STORAGE_HISTORY_KEY, JSON.stringify(history));
            } catch (e) {
                console.error('Ошибка сохранения истории в localStorage', e);
            }
        }
    }

function restoreConsoleHistory() {
    try {
        const savedHistory = localStorage.getItem(STORAGE_HISTORY_KEY);
        if (savedHistory) {
            const history = JSON.parse(savedHistory);
            
            // Восстанавливаем всю историю
            history.forEach(item => {
                printOutput(item.text, item.className, false);
            });
            
            // Двойная страховка: ждем окончания верстки браузером
            setTimeout(() => {
                requestAnimationFrame(() => {
                    const terminalOutput = document.getElementById('terminal-output');
                    const terminal = document.getElementById('terminal');
                    
                    // Прокручиваем внутренний блок вывода
                    if (terminalOutput) {
                        terminalOutput.scrollTop = terminalOutput.scrollHeight;
                    }
                    // На случай, если скролл висит на самом терминале
                    if (terminal) {
                        terminal.scrollTop = terminal.scrollHeight;
                    }
                    // На случай, если прокручивается вся страница целиком
                    window.scrollTo(0, document.body.scrollHeight);
                });
            }, 50); // задержка в 50мс гарантирует, что DOM успел перестроиться
        }
    } catch (e) {
        console.error('Ошибка восстановления истории', e);
    }
}

    function handleQuickNav(e, cmd) {
        if (e && (e.ctrlKey || e.metaKey || e.shiftKey)) {
            executeCommand(cmd, { skipRedirect: true });
            return true;
        }
        if (e && e.preventDefault) e.preventDefault();
        executeCommand(cmd, { skipRedirect: false });
        return false;
    }

    function handleQuickNavAux(e, cmd) {
        if (e && e.button === 1) {
            executeCommand(cmd, { skipRedirect: true });
        }
    }

    async function executeCommand(rawText, options = {}) {
        const prompt = document.getElementById('prompt');
        
        let userProfileData = currentTerminalUser;
        if (!userProfileData && typeof fetchCurrentUser === 'function') {
            userProfileData = await fetchCurrentUser();
        }
        const UserIsAuthed = !!(userProfileData && !userProfileData.isGuest && userProfileData.email && userProfileData.id !== 'guest');

        if (UserIsAuthed) {
            prompt.textContent = `${userProfileData.email}:~$`;
            printOutput(`${userProfileData.email}:~$ ${rawText}`);
        } else {
            prompt.textContent = `user@cloud:~$`;
            printOutput(`user@cloud:~$ ${rawText}`);
        }

        if (/^((download|downoad)\s+(project|code)|export\s+project|fs\s+export|export\s+zip|скачать\s+(код|проект))/i.test(String(rawText || '').trim())) {
            printOutput('⏳ Собираю ZIP-архив...', 'output-info', false);
        }
        
        const result = await processCommand(rawText, options);

        if (result.action === 'clear') {
            terminalOutput.innerHTML = '';
            localStorage.removeItem(STORAGE_HISTORY_KEY);
            return;
        }

        printOutput(result);

        if (result.commandSteps && result.commandSteps.length > 0) {
            setPendingSteps(result.commandSteps, result.inputValue ?? '', result.inputPlaceholder || null);
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
            return;
        }

        if (result.commandPrefix) {
            setPendingCommand(result.commandPrefix, result.inputValue ?? '', result.inputPlaceholder || null);
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
            return;
        }

        if (result.inputValue !== null && result.inputValue !== undefined) {
            input.value = result.inputValue;
            localStorage.setItem(STORAGE_DRAFT_KEY, input.value);
            input.style.height = 'auto';
            input.style.height = input.scrollHeight + 'px';
            input.dispatchEvent(new Event('input'));
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
            return;
        }

        // Автоскролл до низу
        requestAnimationFrame(() => {
            if (terminalOutput) terminalOutput.scrollTop = terminalOutput.scrollHeight;
            if (terminal) terminal.scrollTop = terminal.scrollHeight;
        });

        const parts = rawText.trim().split(/\s+/);
        const baseCmd = parts[0] ? parts[0].toLowerCase() : '';
        const fullCmdLower = rawText.trim().toLowerCase().replace(/\s+/g, ' ');

        const isEditCommand = ['edit', 'ред', 'редактировать', 'ред.', 'редагувати', 'змінити'].includes(baseCmd) && result.style === 'output-success';
        const isDeleteCommand = ['del', 'delete', 'удалить', 'видалити', 'rm'].includes(baseCmd) && result.style === 'output-success';
        const isPinCommand = (
            ['pin', 'unpin', 'fix', 'unfix', 'unfasten', 'detach', 'loosen', 'закріпити', 'закрепить', 'открепить', 'відкріпити', 'приколоть', 'приколоти'].includes(baseCmd) ||
            fullCmdLower.startsWith('make fixed') ||
            fullCmdLower.startsWith('make note fixed') ||
            fullCmdLower.startsWith('make the note fixed') ||
            fullCmdLower.startsWith('make unfixed') ||
            fullCmdLower.startsWith('make note unfixed') ||
            fullCmdLower.startsWith('make the note unfixed') ||
            fullCmdLower === 'make last note fixed' ||
            fullCmdLower === 'make last note unfixed'
        ) && result.style === 'output-success';
        const isAddCommand = ['add', 'добавить', 'додати', 'write'].includes(baseCmd) && result.style === 'output-success';
        const isEntityMutation = result.style === 'output-success' && (result.editedEntity === 'note' || result.editedEntity === 'history');

        if (isEditCommand || isDeleteCommand || isPinCommand || isAddCommand || isEntityMutation) {
            if (result.editedEntity === 'history') {
                await executeCommand('Show history');
            } else if (result.editedEntity === 'note') {
                await executeCommand('Show notes');
            }
        }
    }

    async function handleFormSubmit(e) {
        if (e && e.preventDefault) e.preventDefault();
        const rawText = input.value;

        if (pendingSteps && pendingSteps.length > 0) {
            const payloadText = rawText.trim();
            if (!payloadText) {
                const activeLabel = pendingSteps[pendingSteps.length - 1];
                printOutput(`⚠️ Введите значение для "${activeLabel}" или нажмите ✕ для отмены.`, 'output-error', false);
                return;
            }
            const stepsSnapshot = [...pendingSteps];
            const baseCommand = stepsSnapshot[0];
            const combinedCommand = stepsSnapshot.length === 1
                ? `${baseCommand} ${payloadText}`
                : `${baseCommand}: ${stepsSnapshot.slice(1).join(' ➔ ')} ➔ ${payloadText}`;

            clearPendingCommand(true);
            await executeCommand(combinedCommand, {
                fromTwoStepBar: true,
                pendingSteps: stepsSnapshot,
                stepPayload: payloadText
            });
            return;
        }

        if (!rawText.trim()) return;

        input.value = '';
        localStorage.removeItem(STORAGE_DRAFT_KEY);
        input.style.height = 'auto';
        await executeCommand(rawText, { fromTwoStepBar: false });
    }
</script>
<script>
function autoResizeTextarea() {
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
    const maxHeight = parseFloat(window.getComputedStyle(input).maxHeight);
    if (input.scrollHeight > maxHeight) {
        input.style.overflowY = 'auto';
    } else {
        input.style.overflowY = 'hidden';
    }
}

input.addEventListener('input', () => {
    autoResizeTextarea();
    if (typeof STORAGE_DRAFT_KEY !== 'undefined') {
        localStorage.setItem(STORAGE_DRAFT_KEY, input.value);
    }
});

async function reloadTerminalPage() {
    try {
        if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.update().catch(() => {})));
        }
    } catch (e) {}
    const sep = window.location.pathname || '/index.html';
    window.location.replace(`${sep}?_fresh=${Date.now()}`);
}

function syncViewportHeight() {
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', `${vh}px`);
    if (window.scrollY !== 0 || window.scrollX !== 0) {
        window.scrollTo(0, 0);
    }
    const terminalEl = document.getElementById('terminal');
    if (terminalEl) {
        requestAnimationFrame(() => {
            terminalEl.scrollTop = terminalEl.scrollHeight;
        });
    }
}

if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewportHeight);
    window.visualViewport.addEventListener('scroll', syncViewportHeight);
}
window.addEventListener('resize', syncViewportHeight);
window.addEventListener('pageshow', (e) => {
    syncViewportHeight();
    setTimeout(syncViewportHeight, 100);
    if (e.persisted) {
        autoResizeTextarea();
    }
});
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        syncViewportHeight();
        setTimeout(syncViewportHeight, 100);
    }
});

document.addEventListener('DOMContentLoaded', () => {
    syncViewportHeight();
    const commandInput = document.getElementById('command-input');
    if (commandInput) {
        // Відправка на Enter (без Shift)
        commandInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleFormSubmit(e);
            } else if (e.key === 'Escape' && pendingSteps && pendingSteps.length > 0) {
                e.preventDefault();
                clearPendingCommand(true);
            }
        });
        commandInput.addEventListener('focus', () => {
            setTimeout(syncViewportHeight, 150);
        });
    }
    autoResizeTextarea();
});
</script>
    
<script>
if ('serviceWorker' in navigator) {
    let swRefreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (swRefreshing) return;
        swRefreshing = true;
        window.location.reload();
    });
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js?v=20261122_3', { updateViaCache: 'none' })
            .then((reg) => {
                if (reg && typeof reg.update === 'function') reg.update().catch(() => {});
            })
            .catch((err) => console.log('Ошибка SW:', err));
    });
}
</script>
