<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Cloud Terminal — Dashboard</title>
    
    <link rel="stylesheet" href="/style.css?v=20261121_5">
    <link rel="stylesheet" href="/dashboard.css?v=20261121_5">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/api.js?v=20261121_5"></script>
    <script src="/helpers.js?v=20261121_5"></script>
    <script src="/localization.js?v=20261121_5"></script>
</head>
<body>

    <div class="header">
        <h2>🎛️ Dashboard</h2>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button type="button" class="btn-console" onclick="toggleThemeGlobal()" style="background: #475569; border: 1px solid #64748b; cursor: pointer;">🎨 Тема</button>
            <a href="/house/index.html" class="btn-console" style="background: #15803d; border-color: #166534;">🏠 Дом 1</a>
            <a href="/house2/index.html" class="btn-console" style="background: #0f766e; border-color: #115e59;">🏡 Дом 2</a>
            <a href="/house3/index.html" class="btn-console" style="background: #7c3aed; border-color: #6d28d9;">🏘️ Дом 3</a>
            <a href="/missions.html" class="btn-console" style="background: #0284c7; border-color: #0369a1;">📋 Задания</a>
            <a id="header-action-btn" href="/terminal.html" class="btn-console">💻 В консоль</a>
        </div>
    </div>

    <div id="error-banner" style="display: none; background: #7f1d1d; border: 1px solid #ef4444; color: #fca5a5; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px;"></div>

    <!-- Раздел управления постройками (динамические кнопки) -->
    <div class="section-title">⚡ Управление постройками</div>
    <div id="buildings-controls" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
        <div style="color: #94a3b8; font-size: 13px;">Загрузка динамических построек...</div>
    </div>
    
    <div style="margin-top: 4px; margin-bottom: 20px;">
        <button class="btn-action" onclick="forceSyncWithDB()" style="background:#ef4444; color:#fff; font-size: 11px; padding: 6px 12px;">🔄 Синхронизировать с БД</button>
    </div>

    <!-- Раздел активных таймеров в постройках -->
    <div class="section-title">⏱️ Активные постройки</div>
    <div id="queues-container" class="grid-queues">
        <div class="card">Загрузка построек...</div>
    </div>

    <!-- Склад готовых предметов -->
    <div class="section-title">📦 Склад готовой продукции</div>
    <div id="inventory-container" class="inventory-list">
        <div class="badge">Загрузка склада...</div>
    </div>

    <script src="/dashboard-logic.js?v=20261121_5"></script>
    <script src="/dashboard-ui.js?v=20261121_5"></script>
</body>
</html>
