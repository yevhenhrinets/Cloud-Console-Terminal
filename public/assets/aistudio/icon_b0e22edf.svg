<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ярко-красный фон со скруглением под стандарты приложений -->
  <rect width="512" height="512" rx="112" fill="#E60023"/>
  
  <!-- Символ терминала (>_) сбалансированного размера с классическими отступами -->
  <g transform="translate(106, 126)">
    <!-- Знак больше '>' -->
    <path d="M 30 30 L 140 130 L 30 230" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Курсор '_' -->
    <rect x="175" y="198" width="125" height="44" rx="22" fill="#FFFFFF"/>
  </g>
</svg>
