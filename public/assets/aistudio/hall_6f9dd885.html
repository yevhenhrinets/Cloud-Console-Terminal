<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cloud Terminal — Зал</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Контейнер комнаты с фоном из плитки */
        .room-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('floor.svg');
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        /* Общие стили для объектов-ссылок */
        .appliance-link {
            position: absolute;
            display: block;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
        }

        /* Стиральная машина в левом верхнем углу */
        .tv-link {
            top: 24px;
            left: 24px;
        }

        /* Печь/Плита в правом верхнем углу */
        .router-link {
            top: 24px;
            right: 24px;
        }

        /* Зеленый стол (слева, под стиральной машиной) */
        .sofa-object {
            position: absolute;
            bottom: 24px;
            left: 10px;
            width: 220px;
            height: 220px;
            max-width: 40vw;
            max-height: 40vh;
            object-fit: contain;
            filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.3));
            user-select: none;
            z-index: 5;
        }

        /* Мультиварка на столе (смещена ниже и левее по центру стола) */
        .armchair-link {
            top: 120px;
            right: 24px;
            z-index: 12;
        }

        /* Стили для SVG техники */
        .appliance-object {
            width: 180px;
            height: 180px;
            max-width: 35vw;
            max-height: 35vh;
            object-fit: contain;
            filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.4));
            transition: transform 0.2s ease;
            user-select: none;
        }

        /* Специфичный размер для мультиварки на столе */
        .armchair-object {
            width: 180px;
            height: 180px;
        }

        .appliance-link:hover .appliance-object {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="room-container">
        <!-- Телевизор в левом верхнем углу -->
        <a href="../dashboard.html?queue=6" class="appliance-link tv-link" title="Телевизор">
            <img src="tv.svg" alt="Телевизор" class="appliance-object">
        </a>

        <!-- Роутер в правом верхнем углу -->
        <a href="../dashboard.html?queue=10" class="appliance-link router-link" title="Роутер">
            <img src="router.svg" alt="Роутер" class="appliance-object">
        </a>

        <!-- Диван в нижнем левом углу -->
        <img src="sofa.svg" alt="Диван" class="sofa-object">

        <!-- Кресло под роутером -->
        <a href="../dashboard.html?queue=4" class="appliance-link armchair-link" title="Кресло">
            <img src="armchair.svg" alt="Кресло" class="appliance-object armchair-object">
        </a>
    </div>

</body>
</html>
