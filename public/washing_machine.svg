<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Корпус стиральной машины -->
  <rect x="64" y="64" width="384" height="416" rx="24" fill="#F8F9FA" stroke="#D1D5DB" stroke-width="6"/>
  
  <!-- Верхняя панель управления -->
  <rect x="64" y="64" width="384" height="72" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="4"/>
  
  <!-- Лоток для порошка (слева) -->
  <rect x="96" y="80" width="80" height="40" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="3"/>
  <line x1="106" y1="100" x2="126" y2="100" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

  <!-- Переключатель программ / поворотная ручка (в центре) -->
  <circle cx="256" cy="100" r="18" fill="#FFFFFF" stroke="#4B5563" stroke-width="4"/>
  <circle cx="256" cy="100" r="12" fill="#374151"/>
  <line x1="256" y1="100" x2="256" y2="88" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- Дисплей / Кнопки (справа) -->
  <rect x="336" y="84" width="80" height="32" rx="6" fill="#1E293B"/>
  <text x="356" y="105" font-family="monospace" font-size="14" fill="#38BDF8" font-weight="bold">00:40</text>

  <!-- Круглая дверца люка (внешнее кольцо) -->
  <circle cx="256" cy="304" r="128" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="6"/>
  <circle cx="256" cy="304" r="112" fill="#374151" stroke="#4B5563" stroke-width="4"/>

  <!-- Стекло люка с затененным внутренним пространством -->
  <circle cx="256" cy="304" r="96" fill="#1E293B"/>
  
  <!-- Вода на дне барабана (меньше объема, строго внутри стекла) -->
  <path d="M 167 340 Q 211 355 256 345 T 345 340 A 96 96 0 0 1 167 340 Z" fill="#0284C7" opacity="0.65"/>
  <circle cx="220" cy="365" r="6" fill="#BAE6FD" opacity="0.8"/>
  <circle cx="290" cy="360" r="8" fill="#BAE6FD" opacity="0.8"/>
  <circle cx="256" cy="375" r="5" fill="#BAE6FD" opacity="0.8"/>

  <!-- Блик на стекле -->
  <path d="M 184 232 A 96 96 0 0 1 328 232" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.3" stroke-linecap="round"/>
</svg>
