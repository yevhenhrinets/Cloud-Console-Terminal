<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ножки мультиварки -->
  <rect x="140" y="420" width="40" height="16" rx="6" fill="#111827"/>
  <rect x="332" y="420" width="40" height="16" rx="6" fill="#111827"/>

  <!-- Основной корпус (черный) -->
  <rect x="96" y="160" width="320" height="260" rx="60" fill="#1F2937" stroke="#111827" stroke-width="6"/>

  <!-- Металлическая серебристая/серая вставка по центру -->
  <path d="M 100 230 C 100 200, 412 200, 412 230 L 412 370 C 412 400, 100 400, 100 370 Z" fill="#9CA3AF" stroke="#6B7280" stroke-width="4"/>

  <!-- Панель управления (черный экран на сером корпусе) -->
  <rect x="176" y="240" width="160" height="110" rx="16" fill="#111827" stroke="#374151" stroke-width="4"/>

  <!-- Дисплей с таймером -->
  <rect x="206" y="255" width="100" height="36" rx="6" fill="#065F46"/>
  <text x="220" y="280" font-family="monospace" font-size="20" fill="#34D399" font-weight="bold">00:45</text>

  <!-- Кнопки управления -->
  <circle cx="216" cy="320" r="12" fill="#374151" stroke="#6B7280" stroke-width="2"/>
  <circle cx="256" cy="320" r="14" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
  <circle cx="296" cy="320" r="12" fill="#374151" stroke="#6B7280" stroke-width="2"/>

  <!-- Закругленная крышка мультиварки (черная с серым ободком) -->
  <path d="M 110 170 C 110 90, 402 90, 402 170 Z" fill="#111827"/>
  <path d="M 126 165 C 126 105, 386 105, 386 165 Z" fill="#4B5563"/>

  <!-- Ручка крышки (серая) -->
  <rect x="206" y="80" width="100" height="24" rx="10" fill="#9CA3AF" stroke="#4B5563" stroke-width="4"/>

  <!-- Паровой клапан (справа на крышке) -->
  <ellipse cx="340" cy="125" rx="18" ry="10" fill="#374151" stroke="#111827" stroke-width="3"/>
  <circle cx="340" cy="125" r="5" fill="#111827"/>
</svg>
