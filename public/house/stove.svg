<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Корпус плиты (белый/светлый металл) -->
  <rect x="64" y="64" width="384" height="416" rx="24" fill="#F8F9FA" stroke="#D1D5DB" stroke-width="6"/>
  
  <!-- Панель управления сверху -->
  <rect x="64" y="64" width="384" height="64" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="4"/>
  
  <!-- Ручки управления (4 штуки) -->
  <circle cx="128" cy="96" r="12" fill="#4B5563"/>
  <circle cx="208" cy="96" r="12" fill="#4B5563"/>
  <circle cx="304" cy="96" r="12" fill="#4B5563"/>
  <circle cx="384" cy="96" r="12" fill="#4B5563"/>

  <!-- Решетка варочной поверхности -->
  <path d="M 96 160 H 416 M 96 208 H 416 M 160 160 V 208 M 352 160 V 208" fill="none" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Конфорки (4 штуки) -->
  <circle cx="160" cy="184" r="16" fill="#1F2937"/>
  <circle cx="160" cy="184" r="8" fill="#9CA3AF"/>
  <circle cx="352" cy="184" r="16" fill="#1F2937"/>
  <circle cx="352" cy="184" r="8" fill="#9CA3AF"/>

  <!-- Дверца духовки -->
  <rect x="96" y="256" width="320" height="192" rx="12" fill="#1F2937" stroke="#D1D5DB" stroke-width="4"/>
  
  <!-- Смотровое стекло духовки -->
  <rect x="128" y="288" width="256" height="128" rx="8" fill="#111827" stroke="#374151" stroke-width="4"/>
  
  <!-- Ручка дверцы духовки -->
  <rect x="160" y="272" width="192" height="8" rx="4" fill="#9CA3AF"/>
</svg>
