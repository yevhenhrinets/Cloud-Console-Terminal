<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cloud Terminal — Кухня</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Контейнер комнаты с фоном из плитки */
        .house-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('floor.svg');
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        /* Общие стили для объектов-ссылок */
        .appliance-link {
            position: absolute;
            display: block;
            cursor: pointer;
            text-decoration: none;
            z-index: 10;
        }

        /* Стиральная машина в левом верхнем углу */
        .washer-link {
            top: 24px;
            left: 24px;
        }

        /* Печь/Плита в правом верхнем углу */
        .stove-link {
            top: 24px;
            right: 24px;
        }

        /* Зеленый стол (слева, под стиральной машиной) */
        .table-object {
            position: absolute;
            top: 220px;
            left: 10px;
            width: 220px;
            height: 220px;
            max-width: 40vw;
            max-height: 40vh;
            object-fit: contain;
            filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.3));
            user-select: none;
            z-index: 5;
        }

        /* Мультиварка на столе (смещена ниже и левее по центру стола) */
        .multicooker-link {
            top: 200px;
            left: 25px;
            z-index: 12;
        }

        /* Стили для SVG техники */
        .appliance-object {
            width: 180px;
            height: 180px;
            max-width: 35vw;
            max-height: 35vh;
            object-fit: contain;
            filter: drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.4));
            transition: transform 0.2s ease;
            user-select: none;
        }

        /* Специфичный размер для мультиварки на столе */
        .multicooker-object {
            width: 130px;
            height: 130px;
        }

        .appliance-link:hover .appliance-object {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="house-container">
        <!-- Стиральная машина в левом верхнем углу -->
        <a href="../dashboard.html?queue=3" class="appliance-link washer-link" title="Стиральная машина">
            <img src="washing_machine.svg" alt="Стиральная машина" class="appliance-object">
        </a>

        <!-- Печь в правом верхнем углу -->
        <a href="../dashboard.html?queue=1" class="appliance-link stove-link" title="Печь">
            <img src="stove.svg" alt="Печь" class="appliance-object">
        </a>

        <!-- Зеленый стол под стиральной машиной -->
        <img src="table.svg" alt="Стол" class="table-object">

        <!-- Мультиварка на столе (кликабельная) -->
        <a href="../dashboard.html?queue=8" class="appliance-link multicooker-link" title="Мультиварка">
            <img src="multicooker.svg" alt="Мультиварка" class="appliance-object multicooker-object">
        </a>
    </div>

</body>
</html>
