<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Корпус холодильника -->
  <rect x="96" y="48" width="320" height="416" rx="32" fill="#e2e8f0" stroke="#1e293b" stroke-width="12"/>
  <!-- Линия разделения морозильной и холодильной камер -->
  <line x1="96" y1="176" x2="416" y2="176" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <!-- Дисплей на верхней двери -->
  <rect x="144" y="80" width="80" height="40" rx="8" fill="#1e293b"/>
  <rect x="160" y="92" width="48" height="16" rx="4" fill="#38bdf8"/>
  <!-- Ручки дверей -->
  <rect x="344" y="104" width="16" height="48" rx="8" fill="#334155" stroke="#1e293b" stroke-width="6"/>
  <rect x="344" y="240" width="16" height="80" rx="8" fill="#334155" stroke="#1e293b" stroke-width="6"/>
  <!-- Ножки -->
  <rect x="128" y="464" width="48" height="24" rx="8" fill="#1e293b"/>
  <rect x="336" y="464" width="48" height="24" rx="8" fill="#1e293b"/>
</svg>
